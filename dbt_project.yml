name: 'optimist'
version: '0.1.1'
config-version: 2

require-dbt-version: [">=1.8.0", "<2.0.0"]

# Only used when developing the package locally; consuming projects use their own profile.
profile: 'optimist'

macro-paths: ["macros"]
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
