version: 2

# Dimension build configs — one entry per dimension model.
#
# Each model's meta block is read automatically by optimist.build_dimension()
# at compile time, so the model SQL file only needs to contain the data source
# (a CTE, or nothing at all for ref-based dims) plus a bare macro call:
#
#   {{ optimist.build_dimension() }}
#
# Config keys:
#   source_model  — ref() to a staged source-layer model
#   source_seed   — ref() to a dbt seed file
#   source_cte    — name of a CTE defined earlier in the same model file
#   surrogate_key — columns to hash + optional alias (defaults to <model>_key)
#   deduplicate   — optional; partition_by + order_by to keep one row per key
#   columns       — optional; explicit output list; omit to select all
# ─────────────────────────────────────────────────────────────────────────────

models:

  - name: dim_date
    description: "Calendar date dimension. One row per day from dim_date_start to dim_date_end."
    meta:
      source_cte: date_spine
      surrogate_key:
        columns: [date_day]
        alias: dim_date_key
      columns:
        - date_day
        - date_key
        - year
        - quarter
        - month_num
        - month_name
        - quarter_start_date
        - month_start_date
        - week_of_year
        - week_start_date
        - day_of_year
        - day_of_month
        - day_of_week
        - day_name
        - is_weekend
        - is_weekday

  - name: dim_time
    description: "Time-of-day dimension at minute granularity. 1 440 rows covering a full 24-hour period."
    meta:
      source_cte: time_spine
      surrogate_key:
        columns: [time_of_day]
        alias: dim_time_key
      columns:
        - time_of_day
        - time_hhmm
        - hour
        - minute
        - minute_of_day
        - period_of_day
        - is_business_hours
