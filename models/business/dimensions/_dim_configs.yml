version: 2

# Dimension docs and tests — one entry per dimension model.
#
# Source is declared inline in each model's SQL file (so dbt discovers
# the ref() dependency at parse time). Everything else lives here under
# config.meta and is read by build_dimension() at compile time.
# ─────────────────────────────────────────────────────────────────────────────

models:

  - name: dim_date
    description: "Calendar date dimension. One row per day from dim_date_start to dim_date_end."
    columns:
      - name: dim_date_key
        description: "Surrogate key; MD5 hash of date_day."
      - name: date_day
        description: "Calendar date (YYYY-MM-DD); natural key for this dimension."
      - name: date_key
        description: "Integer date key in YYYYMMDD format, useful for compact storage and range filtering."
      - name: year
        description: "Calendar year (e.g. 2024)."
      - name: quarter
        description: "Quarter of the year (1–4)."
      - name: month_num
        description: "Month number (1–12)."
      - name: month_name
        description: "Full month name (e.g. January)."
      - name: quarter_start_date
        description: "First day of the quarter."
      - name: month_start_date
        description: "First day of the month."
      - name: week_of_year
        description: "Week number within the year (1–53)."
      - name: week_start_date
        description: "First day of the week (Monday)."
      - name: day_of_year
        description: "Day number within the year (1–366)."
      - name: day_of_month
        description: "Day number within the month (1–31)."
      - name: day_of_week
        description: "Day number within the week (0 = Sunday, 6 = Saturday)."
      - name: day_name
        description: "Full day name (e.g. Monday)."
      - name: is_weekend
        description: "True if the day falls on a Saturday or Sunday."
      - name: is_weekday
        description: "True if the day falls on a Monday through Friday."
    config:
      meta:
        surrogate_key:
          columns: [date_day]
          alias: dim_date_key
        columns:
          - date_day
          - date_key
          - year
          - quarter
          - month_num
          - month_name
          - quarter_start_date
          - month_start_date
          - week_of_year
          - week_start_date
          - day_of_year
          - day_of_month
          - day_of_week
          - day_name
          - is_weekend
          - is_weekday

  - name: dim_time
    description: "Time-of-day dimension at minute granularity. 1 440 rows covering a full 24-hour period."
    columns:
      - name: dim_time_key
        description: "Surrogate key; MD5 hash of time_of_day."
      - name: time_of_day
        description: "Time of day at minute precision (HH:MM:SS); natural key for this dimension."
      - name: time_hhmm
        description: "Time formatted as HH:MM string (e.g. 09:05)."
      - name: hour
        description: "Hour of the day (0–23)."
      - name: minute
        description: "Minute of the hour (0–59)."
      - name: minute_of_day
        description: "Minutes elapsed since midnight (0–1439)."
      - name: period_of_day
        description: "Named time period: night (00–05 h), morning (06–11 h), afternoon (12–16 h), evening (17–20 h)."
      - name: is_business_hours
        description: "True if the hour falls between 09:00 and 17:59."
    config:
      meta:
        surrogate_key:
          columns: [time_of_day]
          alias: dim_time_key
        columns:
          - time_of_day
          - time_hhmm
          - hour
          - minute
          - minute_of_day
          - period_of_day
          - is_business_hours
