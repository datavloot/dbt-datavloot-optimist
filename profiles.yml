optimist:
  target: dev
  outputs:
    dev:
      type: duckdb
      # In-memory connection; the lakehouse catalog is accessed via the attach below
      path: ":memory:"
      # Write silver models into the lakehouse DuckLake catalog
      database: lakehouse
      schema: source
      extensions:
        - ducklake
      attach:
        - path: "../../data/catalog.duckdb"
          alias: lakehouse
          type: ducklake
